name: CI

# Offline checks only: the API tests use a fake database and a fake model, so this needs no secrets
# and spends no tokens. Live-database tests stay behind RUN_LIVE=1 and are skipped here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API and SDK tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            sdk/pyproject.toml
      - name: Install
        run: pip install -e sdk -e 'api[dev]'
      - name: API tests
        working-directory: api
        run: pytest -q
      - name: SDK tests
        run: pytest sdk/ -q

  web:
    name: Web lint, tests and build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Placeholders so the build can run without real accounts. Nothing here is a secret.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholderplaceholderplaceholder
